name: main_action
on: [push, pull_request]
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build_eep_d1_mini:
    needs: [test]
    uses: ./.github/workflows/build_eep.yml
    with:
      core: esp8266
      board: d1_mini
  build_eep_hw_test_rtc:
    needs: [test]
    runs-on: ubuntu-latest
    env:
        SKETCH_NAME: SleepUino
    steps:
      - uses: actions/checkout@v6
      - uses: hredan/eep-build-action@v1
        with:
          sketch-name: SleepUinoTestRtc
          sketch-path: './SleepUinoHwTest/SleepUinoTestRtc'
          cpu-frequency: 80
          core: esp8266
          board: d1_mini
          libs: "RTClib"
  build_EEF_packages:
    runs-on: ubuntu-latest
    needs: [build_eep_d1_mini, build_eep_hw_test_rtc]
    env:
        TARGET: win64
    steps:
      - uses: hredan/eef-carefree-action@v1
        with:
          target-os: ${{env.TARGET}}